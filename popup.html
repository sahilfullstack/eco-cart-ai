<!DOCTYPE html>
<html>
  <head>
    <title>EcoCart AI</title>
    <style>
      body {
        width: 400px;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      .popup-container {
        color: #333;
      }

      h1 {
        color: #2ecc71;
        margin-bottom: 20px;
      }

      .summary-section,
      .recommendations-section {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .actions-section {
        display: flex;
        gap: 10px;
      }

      button {
        background: #2ecc71;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        flex: 1;
        transition: background 0.3s;
      }

      button:hover {
        background: #27ae60;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      li {
        margin: 5px 0;
        padding: 5px 0;
        border-bottom: 1px solid #eee;
      }

      li:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
